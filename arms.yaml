# Arm registry. To add a model: add a block here, write its outputs to runs/<id>/pNNN.json in
# the schema prompts/P2_blocks.txt specifies, then run tools/score.py, results_md.py, chart.py,
# build.py. Every arm answers the same prompt (P2). pricing is USD per million tokens; source is
# `measured` (real billing), `list` (published rate) or `proxy` (a comparable model's rate).

cost_model:
  # Characters per output token for this JSON shape, measured from the API's own usage metadata.
  chars_per_output_token: {P2: 2.75}
  # Input tokens per call (image + prompt), used only when a run carries no measured usage.
  input_tokens: {P2: 2744}

arms:
  - id: K_35flash_P2
    label: "Gemini 3.5 Flash · blocks"
    model: gemini-3.5-flash
    prompt: P2
    role: "cheapest Gemini tier that clears the gates"
    runner: "tools/run_gemini_api.py, completed on agy after the API credit ran out (MIXED harness)"
    pricing: {input: 0.15, output: 0.6, source: list}

  - id: L_37flash_P2
    label: "Gemini 3.7 Flash · blocks"
    model: gemini-3.7-flash
    prompt: P2
    role: "best flash on ordered structure"
