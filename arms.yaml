    price_note: "Google's published rate, checked 2026-09-07. This is the introductory rate that runs to 2026-12-31; from 2027-01-01 it becomes $1.50/$7.50, which doubles every figure in this row. Sources in README under Costs. Previously priced by proxy at Gemini 3.5 Flash's supposed rate, which was itself wrong."


